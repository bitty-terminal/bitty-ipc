[workspace]
resolver = "2"
members = [
    "crates/bitty-ipc-api",
    "crates/bitty-ipc-core",
    "crates/bitty-ipc-auth",
    "crates/bitty-ipc-devtools",
    "crates/bitty-ipc-mcp",
    "crates/bitty-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty-ipc"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Platform auth adapters
rustix = { version = "1.1", default-features = false }
nix = { version = "0.31", default-features = false }

# CSPRNG for automation bearer tokens (CTX-0792)
getrandom = "0.4"
